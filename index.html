                transform: translateY(-30px);

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            font-weight: 700;
            margin-bottom: 12px;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .header .emoji {
            font-size: 32px;
            display: inline-block;
            margin-left: 8px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.6;

            display: inline-block;

            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #ff8fa3;
            margin-top: 16px;
            backdrop-filter: blur(10px);
        }

        /* ===== FORM ===== */
        .form-container {
            backdrop-filter: blur(20px);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 32px;
            animation: slideUp 0.6s ease-out backwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }
        .form-group:nth-child(6) { animation-delay: 0.6s; }
        .form-group:nth-child(7) { animation-delay: 0.7s; }
        .form-group:nth-child(8) { animation-delay: 0.8s; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 14px;

            letter-spacing: 0.3px;

        /* ===== TEXT INPUT ===== */
        input[type="text"],

            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus,
        textarea:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 77, 109, 0.5);
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* ===== RADIO & CHECKBOX ===== */
        .radio-group,

            display: flex;
            flex-direction: column;

        }

        .radio-option,
        .checkbox-option {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;

        .checkbox-option:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 77, 109, 0.3);
            transform: translateX(4px);
        }

    <script>
        const form = document.getElementById('relationshipForm');
        const formContainer = document.getElementById('formContainer');
        const successScreen = document.getElementById('successScreen');
        const feelingsSlider = document.getElementById('feelingsSlider');
        const feelingsValue = document.getElementById('feelingsValue');

        // Update slider value display
        feelingsSlider.addEventListener('input', (e) => {
            feelingsValue.textContent = e.target.value;
        });

        // Form submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Basic validation
            const name = document.getElementById('name').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!name || !message) {
                alert('Sab fields fill karo bhai 🙄');
                return;
            }

            // Get form data (not sent anywhere, just collected for demo)
            const formData = new FormData(form);
            const data = {
                name: formData.get('name'),
                status: formData.get('status'),
                feelings: formData.get('feelings'),
                mutual: formData.get('mutual'),
                wants: formData.getAll('wants'),
                ifmutual: formData.get('ifmutual'),
                message: formData.get('message'),
                timestamp: new Date().toLocaleString()
            };

            // Log to console (data stays local, never sent)
            console.log('Application Data (Local Only):', data);

            // Show success screen
            formContainer.style.display = 'none';
            successScreen.style.display = 'block';

            // Scroll to success
            setTimeout(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 200);
        });

        // Prevent form from actually submitting anywhere
        form.onsubmit = function(e) {
            e.preventDefault();
            e.stopPropagation();
            form.dispatchEvent(new Event('submit'));
        };
    </script>
