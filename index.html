<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Tarfa Pyaar Application 💌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff4d6d;
            --dark-bg: #0b0b0d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent-glow: #ff4d6d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #18181d 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 50px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: clamp(28px, 8vw, 42px);
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .header .emoji {
            font-size: 32px;
            display: inline-block;
            margin-left: 8px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 77, 109, 0.1);
            border: 1px solid rgba(255, 77, 109, 0.3);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #ff8fa3;
            margin-top: 16px;
            backdrop-filter: blur(10px);
        }

        /* ===== FORM ===== */
        .form-container {
            backdrop-filter: blur(20px);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 32px;
            animation: slideUp 0.6s ease-out backwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }
        .form-group:nth-child(5) { animation-delay: 0.5s; }
        .form-group:nth-child(6) { animation-delay: 0.6s; }
        .form-group:nth-child(7) { animation-delay: 0.7s; }
        .form-group:nth-child(8) { animation-delay: 0.8s; }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 14px;
            font-size: 15px;
            color: var(--text-primary);
            letter-spacing: 0.3px;
        }

        .label-emoji {
            font-size: 16px;
            margin-left: 4px;
        }

        /* ===== TEXT INPUT ===== */
        input[type="text"],
        textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus,
        textarea:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 77, 109, 0.5);
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* ===== RADIO & CHECKBOX ===== */
        .radio-group,
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-option,
        .checkbox-option {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .radio-option:hover,
        .checkbox-option:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 77, 109, 0.3);
            transform: translateX(4px);
        }

        .radio-option input,
        .checkbox-option input {
            margin-right: 12px;
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .radio-option input:checked + span,
        .checkbox-option input:checked + span {
            color: var(--primary);
            font-weight: 600;
        }

        .radio-option input:checked,
        .checkbox-option input:checked {
            filter: drop-shadow(0 0 4px var(--primary));
        }

        /* ===== SLIDER ===== */
        .slider-container {
            margin-top: 14px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, rgba(255, 77, 109, 0.2), rgba(255, 77, 109, 0.3));
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.4);
            transition: all 0.3s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.6);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
            cursor: pointer;
            border: none;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.4);
            transition: all 0.3s ease;
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.6);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .slider-value {
            text-align: center;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            margin-top: 12px;
        }

        /* ===== FINAL CHECKBOX ===== */
        .final-check {
            display: flex;
            gap: 12px;
            padding: 16px;
            background: rgba(255, 77, 109, 0.05);
            border: 1.5px solid rgba(255, 77, 109, 0.2);
            border-radius: 12px;
            margin-bottom: 32px;
        }

        .final-check input[type="checkbox"] {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            margin-top: 2px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .final-check label {
            margin: 0;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            line-height: 1.5;
        }

        /* ===== BUTTON ===== */
        .submit-btn {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 77, 109, 0.5);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s ease;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        /* ===== SUCCESS SCREEN ===== */
        .success-screen {
            display: none;
            text-align: center;
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 24px;
            display: inline-block;
            animation: bounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .success-screen h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #ff4d6d, #ff8fa3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .success-screen p {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .loading-dots {
            display: inline-block;
            margin: 20px 0;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            margin: 0 6px;
            animation: pulse 1.4s infinite;
        }

        .dot:nth-child(1) { animation-delay: -0.4s; }
        .dot:nth-child(2) { animation-delay: -0.2s; }

        @keyframes pulse {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .success-status {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(255, 77, 109, 0.1);
            border: 1px solid rgba(255, 77, 109, 0.3);
            border-radius: 20px;
            font-size: 14px;
            color: #ff8fa3;
            margin: 20px 0;
            font-weight: 600;
        }

        .success-message {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.8s ease;
            color: var(--text-secondary);
            font-size: 15px;
            margin-top: 24px;
            line-height: 1.6;
        }

        .success-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .loading-dots.done {
            display: none;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 12px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .form-container {
                padding: 28px 18px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            label {
                font-size: 14px;
            }

            .radio-option,
            .checkbox-option {
                padding: 10px 12px;
            }

            .success-screen h2 {
                font-size: 26px;
            }

            .success-icon {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>2 Tarfa Pyaar Application <span class="emoji">💌</span></h1>
            <p>Ek taraf se pyaar ka zamana gaya.<br>Ab dono taraf se approval chahiye.</p>
            <div class="status-badge">Relationship Protocol: PENDING 💀</div>
        </div>

        <!-- FORM -->
        <div class="form-container" id="formContainer">
            <form id="relationshipForm">
                <!-- Q1: Name/Codename -->
                <div class="form-group">
                    <label for="name">Naam / Codename? <span class="label-emoji">🔐</span></label>
                    <input type="text" id="name" name="name" placeholder="E.g. Rahi, Anonymous, The One" required>
                </div>

                <!-- Q2: Relationship Status -->
                <div class="form-group">
                    <label>Tumhara current relationship status? <span class="label-emoji">📊</span></label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="status" value="Single" required>
                            <span>Single</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="status" value="Situationship mein phasa">
                            <span>Situationship mein phasa hua/hu</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="status" value="Its complicated">
                            <span>It's complicated</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="status" value="Emotionally unavailable">
                            <span>Emotionally unavailable</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="status" value="Mujhe khud nahi pata">
                            <span>Mujhe khud nahi pata 💀</span>
                        </label>
                    </div>
                </div>

                <!-- Q3: Feelings Slider -->
                <div class="form-group">
                    <label>Applicant ke liye feelings level? <span class="label-emoji">❤️</span></label>
                    <div class="slider-container">
                        <input type="range" id="feelingsSlider" name="feelings" min="0" max="100" value="50">
                        <div class="slider-labels">
                            <span>Bhai normal reh</span>
                            <span>Shaadi ka venue dekh liya</span>
                        </div>
                        <div class="slider-value"><span id="feelingsValue">50</span>%</div>
                    </div>
                </div>

                <!-- Q4: 2-Tarfa Feelings -->
                <div class="form-group">
                    <label>Kya ye pyaar genuinely 2 tarfa hai? <span class="label-emoji">🔄</span></label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="mutual" value="Bilkul" required>
                            <span>Bilkul ❤️</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="mutual" value="Shayad">
                            <span>Shayad...</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="mutual" value="Mujhe bhi nahi pata">
                            <span>Mujhe bhi nahi pata</span>
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="mutual" value="Form se pata chalega">
                            <span>Ye form bhar ke pata chalega</span>
                        </label>
                    </div>
                </div>

                <!-- Q5: What They Want -->
                <div class="form-group">
                    <label>Tum relationship mein kya chahte ho? <span class="label-emoji">🎯</span></label>
                    <div class="checkbox-group">
                        <label class="checkbox-option">
                            <input type="checkbox" name="wants" value="Loyalty">
                            <span>Loyalty</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="wants" value="Respect">
                            <span>Respect</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="wants" value="Communication">
                            <span>Communication</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="wants" value="Quality time">
                            <span>Quality time</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="wants" value="Mutual effort">
                            <span>Mutual effort</span>
                        </label>
                        <label class="checkbox-option">
                            <input type="checkbox" name="wants" value="Random calls">
